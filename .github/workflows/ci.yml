name: Qualidade do LUPA Saúde
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "package.json"
      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Tipagem
        run: pnpm run typecheck
      - name: Testes unitários
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Smoke HTTP das rotas compiladas
        run: |
          PORT=3010 pnpm start &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          node scripts/smoke.mjs http://127.0.0.1:3010
